name: David Kjerrumgaard
title: Developer Advocate
company:
  name: StreamNative
  url: https://streamnative.io/people/david
tagline: >-
  Globally recognized expert in real-time data, messaging systems, and Big Data
  technologies.

# Hero positioning statement (the big headline + supporting line).
positioning:
  headline: Real-time data, decoded.
  subhead: >-
    I help engineering teams design streaming systems that react in
    milliseconds — and I make the hard parts make sense, on stage and in code.

# Recorded talks shown in the home page "Recent recordings" reel
# (ids from talks.yaml; YouTube recordings get a thumbnail).
reel:
  - berlin-buzzwords-2026
  - data-streaming-summit-2025
  - apache-iceberg-bay-area-meetup-2025

# The talk menu organizers book from (drafted from talk history — edit freely).
# deliveredAt: ids from talks.yaml where this talk (or its closest version) was given.
# Optional per talk: formats (e.g. "45-min talk · 3-hr workshop") and level
# (e.g. "Intermediate") — shown on the card once filled in.
topics:
  - title: Real-Time, Event-Driven Architecture
    description: >-
      Designing systems that react in milliseconds — event sourcing, broker-side
      filtering, and the patterns that make streaming reliable in production.
    deliveredAt: [berlin-buzzwords-2026, data-streaming-summit-2025]
  - title: Apache Pulsar in Production
    description: >-
      From core concepts to advanced patterns, drawn from "Pulsar in Action" and
      seven years as a project committer.
    deliveredAt: [pulsar-summit-europe-2024]
  - title: Cost-Efficient Streaming at Scale
    description: >-
      Cutting the operational overhead and runaway bills of Kafka and Pulsar
      without sacrificing throughput or reliability.
    deliveredAt: [current-2025, apache-iceberg-bay-area-meetup-2025]
  - title: Streaming Infrastructure for the AI Era
    description: >-
      Turning data pipelines into context streams — feeding real-time, personalized
      data to AI agents and the systems that serve them.
    deliveredAt: [current-london-2026]

# Third-person bios for event programs and introductions (the "Speaker kit").
# DRAFT — written from the facts on this site; review before publishing.
speakerBio:
  short: >-
    David Kjerrumgaard is a Developer Advocate at StreamNative and a committer on
    Apache Pulsar. He is the author of "Pulsar in Action" (Manning) and co-author
    of "Practical Hive" (Apress). David has spoken at more than 30 conferences,
    including Current, Berlin Buzzwords, NDC London and Community Over Code, on
    event-driven architecture, streaming at scale and real-time data for AI.
  long:
    - >-
      David Kjerrumgaard is a Developer Advocate at StreamNative and has been a
      committer on the Apache Pulsar project for seven years. He works with
      engineering teams designing streaming systems that react in milliseconds.
    - >-
      His work traces back to the early days of the big-data ecosystem, where he
      helped organizations move from batch processing to edge-to-core streaming
      analytics, drawing on architectural patterns proven building solutions for
      Fortune 500 companies.
    - >-
      David is the author of "Pulsar in Action" (Manning), a hands-on guide to
      building event-streaming applications, and co-author of "Practical Hive"
      (Apress). He has spoken at more than 30 conferences worldwide; his recent
      talks cover broker-side filtering, streaming data in the Apache Iceberg
      lakehouse, and the infrastructure behind AI agents.

bio:
  - >-
    I consider myself a globally recognized expert in the world of real-time
    data, messaging systems, and Big Data technologies. I am also a committer on
    the Apache Pulsar project, having provided invaluable contributions to the
    advancement of this groundbreaking event streaming platform over the past
    seven years.
  - >-
    My work traces back to the early days of the big-data ecosystem, where I
    helped organizations move away from traditional batch processing toward
    reliable edge-to-core streaming analytics — drawing on real-world
    architectural patterns proven while engineering solutions for Fortune 500
    companies.
  - >-
    As an accomplished author, I have penned the highly regarded book "Pulsar in
    Action," which serves as a definitive guide for those seeking to master the
    intricacies of Apache Pulsar. I am also a co-author of "Practical Hive,"
    adding to my list of notable publications.
  - >-
    With numerous speaking engagements around the world, my influence and
    expertise extend far beyond my written work. This site captures some of the
    captivating and informative talks I have delivered across the globe as an
    authority on topics related to real-time data and messaging technologies.

